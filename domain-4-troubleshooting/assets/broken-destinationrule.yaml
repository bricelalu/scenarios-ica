# Intentionally broken DestinationRule for troubleshooting exercises
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: broken-reviews-dr
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: INVALID_LOAD_BALANCER  # Invalid load balancer type
    connectionPool:
      tcp:
        maxConnections: -1  # Invalid negative value
        connectTimeout: -5s  # Invalid negative timeout
      http:
        http1MaxPendingRequests: 0  # Invalid zero value
        maxRetries: -1  # Invalid negative retries
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      loadBalancer:
        simple: RANDOM
  - name: nonexistent
    labels:
      version: v999  # No pods match this label
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 1
---
# Another broken DestinationRule with invalid TLS settings
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: broken-httpbin-dr
  namespace: default
spec:
  host: httpbin.external.com  # Points to non-existent external service
  trafficPolicy:
    tls:
      mode: INVALID_TLS_MODE  # Invalid TLS mode
      caCertificates: /non/existent/path/ca.crt  # Invalid certificate path
    connectionPool:
      tcp:
        maxConnections: 9999999  # Unreasonably high value
        connectTimeout: 1h  # Unreasonably long timeout
    outlierDetection:
      consecutiveGatewayErrors: 0  # Invalid zero value
      interval: -10s  # Invalid negative interval
      baseEjectionTime: -1s  # Invalid negative ejection time