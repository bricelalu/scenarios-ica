# TLS Gateway configuration with certificate management
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: tls-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  # HTTPS server
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: tls-credential
    hosts:
    - httpbin.example.com
    - "*.httpbin.example.com"
  # HTTP server (for redirect)
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - httpbin.example.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tls-vs
spec:
  hosts:
  - httpbin.example.com
  gateways:
  - tls-gateway
  http:
  # Redirect HTTP to HTTPS
  - match:
    - port: 80
    redirect:
      scheme: https
      redirectCode: 301
  # HTTPS routing
  - match:
    - port: 443
    route:
    - destination:
        host: httpbin.default.svc.cluster.local
        port:
          number: 8000
---
# Certificate issuer configuration (for cert-manager if available)
apiVersion: v1
kind: Secret
metadata:
  name: tls-credential
  namespace: istio-system
type: kubernetes.io/tls
data:
  # Placeholder - in production use proper certificates
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t