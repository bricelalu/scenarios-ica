apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: in-place-upgrade
spec:
  profile: demo
  values:
    global:
      proxy:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
        # Updated proxy settings for new version
        logLevel: warning
        componentLogLevel: "misc:error"
    pilot:
      autoscaleEnabled: false
      # Updated pilot settings for new version
      traceSampling: 100.0
      env:
        EXTERNAL_ISTIOD: false
        PILOT_TRACE_SAMPLING: 100.0
        PILOT_ENABLE_WORKLOAD_GATEWAY: true
        # New features enabled in upgrade
        PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY: true
  components:
    pilot:
      k8s:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
        # Updated environment variables
        env:
        - name: PILOT_TRACE_SAMPLING
          value: "100.0"
        - name: PILOT_ENABLE_WORKLOAD_GATEWAY
          value: "true"
        - name: PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY
          value: "true"
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
        # Updated gateway configuration
        service:
          ports:
          - port: 15021
            targetPort: 15021
            name: status-port
          - port: 80
            targetPort: 8080
            name: http2
          - port: 443
            targetPort: 8443
            name: https
    egressGateways:
    - name: istio-egressgateway
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
  meshConfig:
    # Updated mesh configuration
    defaultConfig:
      holdApplicationUntilProxyStarts: true
      proxyStatsMatcher:
        inclusionRegexps:
        - ".*outlier_detection.*"
        - ".*circuit_breaker.*"
        - ".*upstream_rq_retry.*"
        - ".*upstream_rq_pending.*"
        - ".*_cx_.*"
    # Updated extension providers
    extensionProviders:
    - name: prometheus
      prometheus: {}
    - name: jaeger
      jaeger:
        service: jaeger-collector.jaeger.svc.cluster.local
        port: 14268
    defaultProviders:
      metrics:
      - prometheus
      tracing:
      - jaeger