apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: ambient
  values:
    global:
      proxy:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
    pilot:
      autoscaleEnabled: false
      env:
        EXTERNAL_ISTIOD: false
        # Ambient-specific settings
        PILOT_ENABLE_AMBIENT: true
        PILOT_ENABLE_WORKLOAD_GATEWAY: true
    ztunnel:
      # ztunnel is the ambient data plane component
      enabled: true
      resources:
        requests:
          cpu: 0m  # Reduced for Killercoda
          memory: 0Mi  # Reduced for Killercoda
  components:
    pilot:
      k8s:
        env:
        - name: PILOT_ENABLE_AMBIENT
          value: "true"
        - name: PILOT_ENABLE_WORKLOAD_GATEWAY
          value: "true"
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
    # Ambient mode uses ztunnel instead of sidecars
    ztunnel:
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
    # Ambient mode typically doesn't need traditional gateways
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 0m  # Reduced for Killercoda
            memory: 0Mi  # Reduced for Killercoda
    egressGateways:
    - name: istio-egressgateway
      enabled: false  # Often disabled in ambient mode