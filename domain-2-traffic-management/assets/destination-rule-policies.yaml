# DestinationRule traffic policies and subsets
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-destination
spec:
  host: reviews
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 10
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
        maxRetries: 3
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      loadBalancer:
        simple: RANDOM
      connectionPool:
        tcp:
          maxConnections: 5
  - name: v3
    labels:
      version: v3
    trafficPolicy:
      loadBalancer:
        simple: PASSTHROUGH
      connectionPool:
        http:
          maxRequestsPerConnection: 1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: productpage-destination
spec:
  host: productpage
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 5
        maxRetries: 2
  subsets:
  - name: v1
    labels:
      version: v1
  - name: mobile
    labels:
      device: mobile
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 5
        http:
          http1MaxPendingRequests: 1
  - name: api
    labels:
      type: api
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 15
        http:
          http2MaxRequests: 50
  - name: beta
    labels:
      version: beta
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: httpbin-destination
spec:
  host: httpbin
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 10
        connectTimeout: 30s
      http:
        http1MaxPendingRequests: 5
        http2MaxRequests: 50
        maxRequestsPerConnection: 5
        maxRetries: 2
        consecutiveGatewayErrors: 3
        interval: 30s
        baseEjectionTime: 30s