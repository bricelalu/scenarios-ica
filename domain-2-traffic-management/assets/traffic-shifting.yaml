# Traffic shifting configurations for canary deployments
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-traffic-shifting
spec:
  hosts:
  - reviews
  http:
  # Initial canary deployment: 90% v1, 10% v2
  - route:
    - destination:
        host: reviews
        subset: v1
      weight: 90
    - destination:
        host: reviews
        subset: v2
      weight: 10
---
# A/B testing configuration
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-ab-testing
spec:
  hosts:
  - productpage
  http:
  # Route premium users to v2
  - match:
    - headers:
        user-tier:
          exact: premium
    route:
    - destination:
        host: productpage
        subset: v2
  # Route mobile users to mobile-optimized version
  - match:
    - headers:
        user-agent:
          regex: ".*Mobile.*"
    route:
    - destination:
        host: productpage
        subset: mobile
  # Route beta users for testing
  - match:
    - headers:
        user-group:
          exact: beta
    route:
    - destination:
        host: productpage
        subset: beta
  # Default traffic split
  - route:
    - destination:
        host: productpage
        subset: v1
      weight: 80
    - destination:
        host: productpage
        subset: v2
      weight: 20
---
# Blue-green deployment example
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ratings-blue-green
spec:
  hosts:
  - ratings
  http:
  # Feature flag based routing
  - match:
    - headers:
        x-canary-deployment:
          exact: "enabled"
    route:
    - destination:
        host: ratings
        subset: green
  # Production traffic to blue
  - route:
    - destination:
        host: ratings
        subset: blue
---
# Progressive traffic shifting
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: details-progressive-shifting
spec:
  hosts:
  - details
  http:
  # Time-based progressive rollout
  - match:
    - headers:
        x-rollout-phase:
          exact: "phase1"
    route:
    - destination:
        host: details
        subset: v1
      weight: 95
    - destination:
        host: details
        subset: v2
      weight: 5
  - match:
    - headers:
        x-rollout-phase:
          exact: "phase2"
    route:
    - destination:
        host: details
        subset: v1
      weight: 75
    - destination:
        host: details
        subset: v2
      weight: 25
  - match:
    - headers:
        x-rollout-phase:
          exact: "phase3"
    route:
    - destination:
        host: details
        subset: v1
      weight: 25
    - destination:
        host: details
        subset: v2
      weight: 75
  - route:
    - destination:
        host: details
        subset: v1