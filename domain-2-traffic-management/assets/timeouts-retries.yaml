# Timeout and retry configurations
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-timeouts-retries
spec:
  hosts:
  - reviews
  http:
  # Fast timeout for health checks
  - match:
    - uri:
        prefix: "/health"
    timeout: 2s
    retries:
      attempts: 2
      perTryTimeout: 1s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: reviews
        subset: v1
  # Standard timeout for normal requests
  - match:
    - headers:
        x-request-type:
          exact: "standard"
    timeout: 15s
    retries:
      attempts: 3
      perTryTimeout: 5s
      retryOn: 5xx,gateway-error,connect-failure,refused-stream
      retryRemoteLocalities: true
    route:
    - destination:
        host: reviews
        subset: v1
  # Long timeout for batch operations
  - match:
    - headers:
        x-request-type:
          exact: "batch"
    timeout: 300s
    route:
    - destination:
        host: reviews
        subset: v1
  # Default configuration
  - route:
    - destination:
        host: reviews
        subset: v1
    timeout: 30s
    retries:
      attempts: 2
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
---
# HTTPBin timeout and retry configuration
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: httpbin-timeouts-retries
spec:
  hosts:
  - httpbin
  http:
  # No retries for POST requests
  - match:
    - method:
        exact: POST
    timeout: 30s
    route:
    - destination:
        host: httpbin
        port:
          number: 8000
  # Aggressive retries for GET requests
  - match:
    - method:
        exact: GET
    - uri:
        prefix: "/get"
    timeout: 20s
    retries:
      attempts: 5
      perTryTimeout: 3s
      retryOn: 5xx,reset,connect-failure,refused-stream
      retryRemoteLocalities: true
    route:
    - destination:
        host: httpbin
        port:
          number: 8000
  # Special handling for status endpoints
  - match:
    - uri:
        prefix: "/status/"
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,gateway-error
    route:
    - destination:
        host: httpbin
        port:
          number: 8000
  # Delay endpoint with long timeout
  - match:
    - uri:
        prefix: "/delay"
    timeout: 60s
    retries:
      attempts: 2
      perTryTimeout: 25s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: httpbin
        port:
          number: 8000
  # Default
  - route:
    - destination:
        host: httpbin
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 2
      perTryTimeout: 10s
---
# Cascading timeouts for microservices
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-cascading-timeouts
spec:
  hosts:
  - productpage
  http:
  - route:
    - destination:
        host: productpage
        port:
          number: 9080
    timeout: 60s
    retries:
      attempts: 2
      perTryTimeout: 25s
      retryOn: gateway-error,connect-failure,refused-stream
