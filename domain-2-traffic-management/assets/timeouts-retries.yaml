# External service timeouts
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: external-service-timeouts
spec:
  hosts:
  - httpbin.org
  http:
  - match:
    - uri:
        prefix: "/delay"
    timeout: 45s
    retries:
      attempts: 2
      perTryTimeout: 20s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: httpbin.org
        port:
          number: 80
  - route:
    - destination:
        host: httpbin.org
        port:
          number: 80
    timeout: 15s
    retries:
      attempts: 3
      perTryTimeout: 5s
      retryOn: gateway-error,connect-failure,refused-stream